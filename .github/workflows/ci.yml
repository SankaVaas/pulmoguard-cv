name: CI

# Runs on every push and PR to keep main always in a deployable state.
# Three independent job groups (ml, backend, frontend) run in parallel
# since they have no build-time dependency on each other in CI - only
# the runtime backend->ml relationship requires ml to be installed first
# within the backend job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ml-tests:
    name: ML core — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check pulmoguard/ --output-format=github

      - name: Run tests
        run: pytest tests/ -v

  backend-tests:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install ml core (backend depends on it at runtime)
        run: pip install --upgrade pip && pip install ../ml

      - name: Install backend dependencies
        run: pip install -r requirements.txt && pip install ruff

      - name: Lint (ruff)
        run: ruff check app/ --output-format=github

      - name: Run tests
        env:
          ENVIRONMENT: development
          JWT_SECRET_KEY: ci-test-secret
        run: pytest tests/ -v

  frontend-build:
    name: Frontend — lint, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck & build
        run: npm run build

  docker-build-check:
    name: Docker images build successfully
    runs-on: ubuntu-latest
    needs: [ml-tests, backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t pulmoguard-backend:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t pulmoguard-frontend:ci .
