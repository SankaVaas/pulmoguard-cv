server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any unmatched path falls back to index.html so
    # client-side routing (react-router) handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed static assets; never cache index.html itself so
    # deploys are picked up immediately without a manual cache-bust.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
