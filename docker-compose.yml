# Orchestrates the full PulmoGuard system: backend API + frontend.
#
# Usage:
#   1. Place your trained checkpoint at ml/outputs/checkpoints/pulmoguard_best.pt
#   2. Copy backend/.env.example to backend/.env and set real secrets
#   3. docker compose up --build
#
# Frontend: http://localhost:5173
# Backend:  http://localhost:8000  (docs at /docs outside production)

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: pulmoguard-backend:latest
    container_name: pulmoguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      # Mount checkpoints read-only: model weights are a deployment
      # artifact, not baked into the image (see backend/Dockerfile comments).
      - ./ml/outputs/checkpoints:/app/ml/outputs/checkpoints:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    image: pulmoguard-frontend:latest
    container_name: pulmoguard-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
