# Shared lint configuration for ml/ and backend/ (used by CI and `make lint`).
target-version = "py311"
line-length = 110

[lint]
select = ["E", "F", "I", "B", "UP", "PLR", "RUF"]
ignore = [
    # FastAPI's dependency-injection pattern requires calling Depends()/File()
    # in argument defaults - this is the documented, correct usage, not a bug.
    "B008",
]

[lint.per-file-ignores]
# Test files commonly re-import/monkeypatch in ways that trip F401/PLR-style checks.
"**/tests/*.py" = ["PLR2004"]
